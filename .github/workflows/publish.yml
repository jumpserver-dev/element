name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version type (patch, minor, major) or custom version like 2.15.15"
        required: true
        default: "patch"
        type: string
      publish_npm:
        description: "Whether to publish to NPM (true/false)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "11.15.0"
          registry-url: "https://registry.npmjs.com"

      - name: Install dependencies
        env:
          # Use GitHub releases for node-sass pre-built binaries
          SASS_BINARY_SITE: https://github.com/sass/node-sass/releases/download
        run: |
          # Install dependencies but skip postinstall scripts
          npm install --legacy-peer-deps
          # Manually trigger node-sass binary download (skips build step)
          cd node_modules/node-sass
          node scripts/install.js || echo "Binary download failed, will try during build"
          cd ../..
          # Verify binary exists
          if [ -f node_modules/node-sass/vendor/linux-x64-64/binding.node ]; then
            echo "node-sass binary downloaded successfully"
          else
            echo "Warning: node-sass binary not found"
          fi

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Check version type
        id: version_check
        run: |
          VERSION_TYPE="${{ inputs.version_type }}"
          if [[ "$VERSION_TYPE" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "is_custom=true" >> $GITHUB_OUTPUT
            echo "custom_version=$VERSION_TYPE" >> $GITHUB_OUTPUT
          else
            echo "is_custom=false" >> $GITHUB_OUTPUT
            echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
          fi

      - name: Bump version (if needed)
        if: steps.version_check.outputs.is_custom == 'false'
        run: |
          npm version ${{ steps.version_check.outputs.version_type }} --no-git-tag-version

      - name: Set custom version (if provided)
        if: steps.version_check.outputs.is_custom == 'true'
        run: |
          npm version ${{ steps.version_check.outputs.custom_version }} --no-git-tag-version

      - name: Get version
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"

      - name: Build project (skip webpack to avoid hangs)
        timeout-minutes: 30
        run: npm run dist

      - name: Pack npm tarball
        id: pack
        run: |
          FILE=$(npm pack | tail -n 1)
          echo "file=$FILE" >> $GITHUB_OUTPUT

      - name: Verify tarball contents
        run: |
          echo "Listing contents of ${{ steps.pack.outputs.file }}"
          tar -tzf "${{ steps.pack.outputs.file }}" | sed -n '1,50p'
          echo "Checking required directories exist..."
          tar -tzf "${{ steps.pack.outputs.file }}" | grep -q "/lib/" || (echo "Missing lib/ in package" && exit 1)
          tar -tzf "${{ steps.pack.outputs.file }}" | grep -q "/types/" || (echo "Missing types/ in package" && exit 1)

      - name: Publish to NPM
        if: ${{ inputs.publish_npm == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

      - name: Create Git tag and push
        run: |
          git tag -a "v${{ steps.package_version.outputs.version }}" -m "Release v${{ steps.package_version.outputs.version }}"
          git push origin "v${{ steps.package_version.outputs.version }}"
          git push origin HEAD:${{ github.ref }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.package_version.outputs.version }}
          name: Release v${{ steps.package_version.outputs.version }}
          body: |
            Automated release for v${{ steps.package_version.outputs.version }}.
          draft: false
          prerelease: false
          files: |
            ${{ steps.pack.outputs.file }}
